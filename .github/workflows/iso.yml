name: ISO

# Milestone M1: build the Linbox OS live ISO twice (reproducibility), then boot it
# in QEMU with UEFI Secure Boot and check the live session.

on:
  pull_request:
    paths:
      - "build/**"
      - "packages/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # Every shell script in the tree (found by shebang), so new ones can't be missed.
        run: |
          git ls-files -z build packages tests tools |
            xargs -0 grep -lE '^#!/bin/(ba)?sh' |
            tee /dev/stderr | xargs shellcheck -x
      - name: python syntax
        run: python3 -m py_compile tests/vm/boot-test.py tools/dep-closure.py

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - name: Build ISO
        env:
          BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}
        run: ./build/scripts/build-in-docker
      - name: Upload manifest and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.copy }}
          path: |
            out/*.packages
            out/*.build-info.json
            out/*.SHA256SUMS
            out/*.build.log
          retention-days: 14
      - name: Upload ISO
        if: matrix.copy == 'a'
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: out/*.iso
          compression-level: 0
          retention-days: 7

  reproducibility:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
      - name: Compare package manifests of the two builds
        run: |
          diff -u manifest-a/*.packages manifest-b/*.packages
          echo "Package manifests identical: $(wc -l < manifest-a/*.packages) packages"

  boot-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and OVMF
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf
      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: iso
      - name: Boot test (UEFI Secure Boot)
        run: python3 tests/vm/boot-test.py iso/*.iso boot-test
      - name: Upload boot test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: |
            boot-test/serial.log
            boot-test/results.json
            boot-test/screen.png
          retention-days: 14
